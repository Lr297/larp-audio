name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .

          if (Test-Path "packaging/requirements-windows.txt") {
            pip install -r packaging/requirements-windows.txt
          }
          else {
            pip install pyinstaller
          }

      - name: Download Windows FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"

          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg-windows.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg-windows"
          $targetPath = "resources/bin/windows-x86_64"

          Write-Host "Downloading FFmpeg..."
          Invoke-WebRequest `
            -Uri $ffmpegUrl `
            -OutFile $archivePath

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Write-Host "Extracting FFmpeg..."
          Expand-Archive `
            -Path $archivePath `
            -DestinationPath $extractPath `
            -Force

          $ffmpegFile = Get-ChildItem `
            -Path $extractPath `
            -Recurse `
            -File `
            -Filter "ffmpeg.exe" |
            Select-Object -First 1

          $ffprobeFile = Get-ChildItem `
            -Path $extractPath `
            -Recurse `
            -File `
            -Filter "ffprobe.exe" |
            Select-Object -First 1

          if (-not $ffmpegFile) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }

          if (-not $ffprobeFile) {
            throw "ffprobe.exe was not found in the downloaded archive."
          }

          New-Item `
            -ItemType Directory `
            -Path $targetPath `
            -Force |
            Out-Null

          Copy-Item `
            -Path $ffmpegFile.FullName `
            -Destination "$targetPath/ffmpeg.exe" `
            -Force

          Copy-Item `
            -Path $ffprobeFile.FullName `
            -Destination "$targetPath/ffprobe.exe" `
            -Force

          Write-Host "FFmpeg files prepared:"
          Get-Item "$targetPath/ffmpeg.exe"
          Get-Item "$targetPath/ffprobe.exe"

          & "$targetPath/ffmpeg.exe" -version
          & "$targetPath/ffprobe.exe" -version

      - name: Build Application with PyInstaller
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/installer.iss

      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path "Output/LARP-Audio-Windows-x64-Setup.exe")) {
            throw "Windows installer was not created."
          }

          Get-Item "Output/LARP-Audio-Windows-x64-Setup.exe"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LARP-Audio-Windows-x64-Setup
          path: Output/LARP-Audio-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
