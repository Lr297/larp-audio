name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          pip install -e .

          if (Test-Path "packaging/requirements-windows.txt") {
            pip install -r packaging/requirements-windows.txt
          }
          else {
            pip install pyinstaller
          }

          pip install pillow

      - name: Download Windows FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"

          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg-windows.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg-windows"
          $targetPath = "resources/bin/windows-x86_64"

          Write-Host "Downloading FFmpeg..."

          Invoke-WebRequest `
            -Uri $ffmpegUrl `
            -OutFile $archivePath

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Write-Host "Extracting FFmpeg..."

          Expand-Archive `
            -Path $archivePath `
            -DestinationPath $extractPath `
            -Force

          $ffmpegFile = Get-ChildItem `
            -Path $extractPath `
            -Recurse `
            -File `
            -Filter "ffmpeg.exe" |
            Select-Object -First 1

          $ffprobeFile = Get-ChildItem `
            -Path $extractPath `
            -Recurse `
            -File `
            -Filter "ffprobe.exe" |
            Select-Object -First 1

          if (-not $ffmpegFile) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }

          if (-not $ffprobeFile) {
            throw "ffprobe.exe was not found in the downloaded archive."
          }

          New-Item `
            -ItemType Directory `
            -Path $targetPath `
            -Force |
            Out-Null

          Copy-Item `
            -Path $ffmpegFile.FullName `
            -Destination "$targetPath/ffmpeg.exe" `
            -Force

          Copy-Item `
            -Path $ffprobeFile.FullName `
            -Destination "$targetPath/ffprobe.exe" `
            -Force

          Write-Host "FFmpeg prepared successfully."

      - name: Prepare Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iconCandidates = @(
            "resources/icons/larp_audio_master.png",
            "resources/icons/icon_512x512.png",
            "resources/icons/icon_256x256.png",
            "resources/icons/icon_128x128.png",
            "landing/assets/app-icon.png"
          )

          $sourceIcon = $iconCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $sourceIcon) {
            Write-Host "Files inside resources/icons:"
            if (Test-Path "resources/icons") {
              Get-ChildItem "resources/icons" -Recurse
            }

            throw "No source PNG icon was found."
          }

          New-Item `
            -ItemType Directory `
            -Path "resources/icons" `
            -Force |
            Out-Null

          $env:LARP_ICON_SOURCE = (Resolve-Path $sourceIcon).Path

          $pythonScript = Join-Path $env:RUNNER_TEMP "create_windows_icon.py"

          @'
          import os
          from pathlib import Path

          from PIL import Image

          source = Path(os.environ["LARP_ICON_SOURCE"])
          target = Path("resources/icons/larp-audio.ico")

          image = Image.open(source).convert("RGBA")

          if image.size != (256, 256):
              image = image.resize(
                  (256, 256),
                  Image.Resampling.LANCZOS,
              )

          target.parent.mkdir(parents=True, exist_ok=True)

          image.save(
              target,
              format="ICO",
              sizes=[
                  (16, 16),
                  (24, 24),
                  (32, 32),
                  (48, 48),
                  (64, 64),
                  (128, 128),
                  (256, 256),
              ],
          )

          print(f"Created Windows icon: {target.resolve()}")
          '@ | Set-Content `
            -Path $pythonScript `
            -Encoding UTF8

          python $pythonScript

          if (-not (Test-Path "resources/icons/larp-audio.ico")) {
            throw "Windows ICO file was not created."
          }

          Get-Item "resources/icons/larp-audio.ico"

      - name: Build Application with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/build_windows.ps1

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/installer.iss

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "Output/LARP-Audio-Windows-x64-Setup.exe")) {
            Write-Host "Output directory contents:"

            if (Test-Path "Output") {
              Get-ChildItem "Output" -Recurse
            }

            throw "Windows installer was not created."
          }

          Get-Item "Output/LARP-Audio-Windows-x64-Setup.exe"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LARP-Audio-Windows-x64-Setup
          path: Output/LARP-Audio-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
