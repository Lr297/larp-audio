schema_version = 1

[pipeline]
# Hard rejection limit; input is never truncated automatically.
max_script_characters = 500000

[paths]
work_directory = "./work/jobs"
output_root = "./output"
model_root = "./models"

# Explicit bundled paths will be configured by the packaged application.
# ffmpeg_path = "/absolute/path/to/ffmpeg"
# ffprobe_path = "/absolute/path/to/ffprobe"
# bundled_tools_directory = "./distribution/tools"

[audio]
subprocess_timeout_seconds = 60
canonical_container = "wav"
canonical_codec = "pcm_s16le"
canonical_sample_format = "s16"
canonical_sample_rate = 48000
canonical_channels = 1

[pauses]
preserve_edge_silence = true

# Detection values are intentionally unset until a concrete policy is chosen.
# Example syntax (not production defaults):
# silence_threshold_db = -40.0
# minimum_pause_duration_ms = 500
# shortening_policy_version = "example-v1"
# minimum_pause_to_shorten_ms = 1000
# target_remaining_pause_ms = 350
# maximum_removed_per_pause_ms = 3000
# Add long_pause_threshold_ms, retained_pause_ms, pre_word_guard_ms, and
# post_word_guard_ms only after the versioned removal policy is approved.

[subtitles]
# Deterministic Stage 9 defaults aimed at short/vertical advertising videos.
max_lines = 2
max_characters_per_line = 32
# The 45-character display ceiling and scoring limits are owned by
# conservative-subtitles-v8-syntax-guardrails-45chars-gapless and
# are intentionally not user-configurable.
min_duration_ms = 800
max_duration_ms = 7000
max_characters_per_second = 20.0
preferred_gap_break_ms = 450
strong_gap_break_ms = 1200
preferred_min_words_per_block = 2
preferred_min_visible_chars = 8
new_block_penalty = 1800
single_word_block_penalty = 1600
short_block_penalty = 800
max_unresolved_words_per_block = 2
minimum_timing_coverage_for_export = 0.70
allow_unresolved_attachment = true
max_segmentation_cells = 250000

[models]
# Local model selection is intentionally unset. Supported names are tiny,
# base, and small. Place a complete CTranslate2 model under model_root/<name>
# or set model_path explicitly. The application never downloads a model.
# whisper_backend = "faster-whisper"
# whisper_model = "tiny"
# model_path = "/absolute/path/to/faster-whisper-tiny"
# device = "cpu"
# compute_type = "int8"
# language = "en"
# beam_size = 5
# temperature = 0.0

[alignment]
# Technical deterministic defaults. These are not release-corpus thresholds.
fuzzy_threshold = 0.84
min_fuzzy_token_length = 4
max_dp_cells = 250000
max_interpolation_words = 3
max_interpolation_gap_ms = 2000
minimum_coverage_warning = 0.80
enable_split_merge = true
enable_fuzzy_matching = true
